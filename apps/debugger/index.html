<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover がないと env(safe-area-inset-*) が 0 になる（ノッチ端末で操作盤が隠れる） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>鉄道運転シミュレータ — デバッグビューア</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2310141a'/%3E%3Crect x='9' y='6' width='14' height='16' rx='3' fill='%233f6fb5'/%3E%3Crect x='11' y='9' width='10' height='6' rx='1' fill='%230d1117'/%3E%3Crect x='7' y='24' width='18' height='2' fill='%239aa7b4'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="viewport">
        <canvas id="scene" tabindex="0"></canvas>
        <div id="hud"></div>
        <div id="gmeter"></div>
        <div id="touch"></div>
        <div id="help">
          <strong>操作</strong>
          <div>Z / A（↑ / ↓）: 力行 N → P1 → …</div>
          <div>. / ,（→ / ←）: ブレーキ N → 抑速 → B1 → … → 非常</div>
          <div class="note">ワンハンドルでは 4 キーとも 1 本の軸を上下に動かす</div>
          <div>Space: 非常ブレーキ</div>
          <div>Enter: 確認扱い / R: 保安装置復帰</div>
          <div>S: 砂撒き / H: 警笛 / D: 戸閉め</div>
          <div>1-5: カメラ（運転席/追跡/側面/俯瞰/自由）</div>
          <div>O: 自動運転（ATO）の入切</div>
          <div>P: 一時停止 / F: 1 ステップ / [ ]: 速度倍率</div>
          <div>M: 消音</div>
          <div class="note">
            手元のノッチが効かないときは HUD の「実効」行を確認（保安装置や戸開でカットされる）
          </div>
        </div>
      </div>
      <button id="drawer" type="button" aria-label="走行条件パネルの開閉">≡</button>
      <aside id="side">
        <div id="conditions">
          <label class="pick">車両<select id="vehicle"></select></label>
          <label class="pick">天気<select id="weather"></select></label>
          <span class="pick">保安装置<span id="safety" class="radios"></span></span>
          <label class="toggle"><input id="preceding" type="checkbox" />先行列車</label>
          <label class="toggle"><input id="opposing" type="checkbox" />対向列車</label>
          <label class="toggle"><input id="platform" type="checkbox" />2 番線から発車</label>
          <label class="toggle"><input id="onehandle" type="checkbox" />ワンハンドルマスコン</label>
        </div>
        <div id="controls">
          <button id="restart" type="button">再スタート</button>
          <button id="pause" type="button">一時停止</button>
          <span id="rate">1.0x</span>
          <button id="save" type="button">記録を保存</button>
          <label class="file">
            記録を読込
            <input id="load" type="file" accept="application/json" />
          </label>
          <button id="mute" type="button">音を出す</button>
          <button id="touchui" type="button">タッチ運転台</button>
        </div>
        <div id="mixer"></div>
        <div id="charts"></div>
      </aside>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
